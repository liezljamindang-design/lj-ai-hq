<!--
  ENTER AI HEADQUARTERS button for the LIEZL OS portfolio.

  The portfolio is one full-screen Custom Code element, so the button lives
  INSIDE that code, in the top bar to the left of the search box. It is added
  with the three edits below. They use the portfolio's own colour variables,
  so the button follows its light and dark themes.

  1. In the <style> block, after the "#los .kbtn kbd{...}" rule, add:

     #los .hqbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--gold);background:var(--goldsoft);color:var(--goldtx);font-weight:700;font-size:14px;white-space:nowrap;flex:none;transition:background .15s,border-color .15s,color .15s}
     #los .hqbtn:hover,#los .hqbtn:focus-visible{background:var(--soft);border-color:var(--accent);color:var(--accent)}
     #los .hqbtn .hq-short{display:none}

  2. In the phone rules (@media max-width:900px), after
     "#los .kbtn span,#los .kbtn kbd{display:none}", add:

     #los .hqbtn{padding:0 9px;font-size:13px}#los .hqbtn .hq-long{display:none}#los .hqbtn .hq-short{display:inline}

  3. In the script, in the line that builds the top bar (var top=...),
     paste the link below immediately before <button class="kbtn" ...>.
-->
<a class="hqbtn" href="https://hq.liezljamindang.site" title="See AI + GoHighLevel in action" aria-label="Enter AI Headquarters: see AI and GoHighLevel in action"><span class="hq-long">Enter AI Headquarters</span><span class="hq-short">AI HQ</span><span aria-hidden="true">&#8599;</span></a>
